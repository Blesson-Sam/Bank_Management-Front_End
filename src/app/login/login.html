<div class="login-container">
  <div class="login-content">
    <div class="login-header">
      <h1><span class="highlight">Login</span></h1>
      <p class="login-subtitle">Welcome back! Please log in to access your account.</p>
    </div>

    <form class="login-form">
      <div class="form-row">
        <div class="form-group">
          <input type="email" id="email" name="email" placeholder="Enter your Email" required>
        </div>
        
        <div class="form-group password-group">
          <input type="password" id="password" name="password" placeholder="Enter your Password" required>
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <span class="eye-icon">👁️</span>
          </button>
        </div>
      </div>

      <div class="form-options">
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn primary">Login</button>
      
      <button type="button" class="signup-btn secondary" (click)="navigateToSignup()">Sign Up</button>

      <div class="divider">
        <span>Or Continue with</span>
      </div>

      <div class="social-login">
        <button type="button" class="social-btn google">
          <span class="social-icon">G</span>
        </button>
        <button type="button" class="social-btn facebook">
          <span class="social-icon">f</span>
        </button>
        <button type="button" class="social-btn apple">
          <span class="social-icon">🍎</span>
        </button>
      </div>
    </form>
  </div>
</div>
