<div class="login-container">
  <div class="login-modal">
    <button class="close-btn" (click)="closeModal()" aria-label="Close login modal">
      <span>×</span>
    </button>
    
    <div class="login-header">
      <h2>Please login</h2>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="name@company.com" 
          [(ngModel)]="email"
          (input)="clearError()"
          required
          [disabled]="isLoading()"
        >
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-container">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            [(ngModel)]="password"
            (input)="clearError()"
            required
            [disabled]="isLoading()"
          >
          <button 
            type="button" 
            class="password-toggle" 
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading()"
            aria-label="Toggle password visibility">
            <span class="eye-icon">
              @if (showPassword()) {
                HIDE
              } @else {
                SHOW
              }
            </span>
          </button>
        </div>
      </div>

      <!-- User Type Toggle -->
      <div class="user-type-group">
        <span class="user-type-label">Login as:</span>
        <div class="toggle-container">
          <button 
            type="button" 
            class="toggle-btn" 
            (click)="toggleUserType()"
            [disabled]="isLoading()">
            <span class="toggle-slider" [class.admin]="userType() === 'ADMIN'"></span>
            <span class="toggle-text customer" [class.active-text]="userType() === 'CUSTOMER'">Customer</span>
            <span class="toggle-text admin" [class.active-text]="userType() === 'ADMIN'">Admin</span>
          </button>
          <div class="selected-type">
            Selected: <strong>{{ userType() }}</strong>
          </div>
        </div>
      </div>

      <button 
        type="submit" 
        class="continue-btn"
        [disabled]="isLoading() || loginForm.invalid">
        @if (isLoading()) {
          <span class="loading-spinner"></span>
          Logging in...
        } @else {
          Continue
        }
      </button>
      
      <div class="signup-prompt">
        <span>Don't have an account?</span>
        <a href="#" class="get-started-link" (click)="navigateToSignup()">Get started</a>
      </div>
    </form>
  </div>
</div>
<footer class="footer">
    <div class="footer-content">
      <div class="footer-bottom">        
        <div class="footer-legal">
          <span>Aurora Bank All Rights Reserved</span>
          <div class="legal-links">
            <a href="#" class="legal-link">Privacy Policy</a>
            <span>|</span>
            <a href="#" class="legal-link">Terms of Service</a>
          </div>
        </div>
      </div>
    </div>
  </footer>
